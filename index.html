<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ignition — Stage Cut</title>
<style>
:root{color-scheme:dark;--void:#080a11;--paper:#eeeae0;--bright:#f6f1e7;--dim:#a6a9b8;--ember:#ffab72;--ice:#9daeff;--edge:#ffffff25;--mono:ui-monospace,'Courier New',monospace;--sans:Arial,'Noto Sans SC',sans-serif}
*{box-sizing:border-box}
html,body{margin:0;background:var(--void);height:100%;color:var(--bright);font:16px var(--sans)}
body{overflow:hidden}
button,a,input{touch-action:manipulation}button,input{font:inherit}button{cursor:pointer}button:disabled{cursor:default;opacity:.3}button:focus-visible,a:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid #ffa872;outline-offset:3px}a{color:inherit}
#theater{height:100dvh;display:grid;grid-template-rows:1fr auto;place-items:center;position:relative}
#stage{position:relative;width:min(100vw,calc((100dvh - 58px)*16/9));aspect-ratio:16/9;container-type:inline-size;overflow:hidden;isolation:isolate;background:#101220}
.scene{position:absolute;inset:0;overflow:hidden;isolation:isolate;background:#111421;color:var(--bright);--tone:var(--ember);--sub:#bcbdc9;--line:#ffffff2c}
.scene.paper{background:var(--paper);color:#191927;--tone:#982f17;--sub:#514f60;--line:#32253e32;color-scheme:light}
.scene.cobalt{background:#151a33;--tone:#a9b7ff}
.scene.out{z-index:1;pointer-events:none}.scene.in{z-index:2}
.scene.in[data-effect="cut"]{animation:cut .55s ease both}
.scene.in[data-effect="wipe"]{animation:wipe .75s cubic-bezier(.22,.7,.18,1) both}
.scene.in[data-effect="lift"]{animation:lift .72s cubic-bezier(.18,.75,.2,1) both}
.scene.in[data-effect="iris"]{animation:iris 1.05s cubic-bezier(.23,.64,.21,1) both}
@keyframes cut{from{opacity:0}to{opacity:1}}
@keyframes wipe{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0)}}
@keyframes lift{from{opacity:0;transform:translateY(5%) scale(1.01)}to{opacity:1;transform:none}}
@keyframes iris{from{clip-path:circle(0 at 76% 53%)}to{clip-path:circle(115% at 76% 53%)}}
.poster,.shade,.rings{position:absolute;inset:0;z-index:-1;pointer-events:none}.poster{background-position:center;background-size:cover;animation:post 1.55s cubic-bezier(.2,.7,.2,1) both}
.shade{background:linear-gradient(90deg,#070910ee 0%,#070910a9 36%,#07091022 67%,transparent),linear-gradient(0deg,#080a11bb,transparent 23%)}
.rings{width:100%;height:100%;opacity:.62}
@keyframes post{from{transform:scale(1.075);filter:brightness(.65)}to{transform:none;filter:none}}
.frame{height:100%;padding:4.5cqw 5.25cqw 3.7cqw;position:relative;display:flex;flex-direction:column;justify-content:flex-start}
.brand{font:700 1.03cqw var(--mono);letter-spacing:.15em;color:var(--tone);margin:0 0 2.1cqw;text-transform:uppercase}
h1,h2,h3,p{margin:0}h1,h2{letter-spacing:-.057em;line-height:.94;font-weight:800;text-wrap:balance}h1{font-size:9.2cqw}h2{font-size:5.15cqw}h3{font-size:2.25cqw;line-height:1.05;letter-spacing:-.04em}
p{line-height:1.36}.lead{font-size:1.86cqw;color:var(--sub);margin-top:1.7cqw;max-width:63cqw}.hero .lead{text-wrap:balance;color:var(--bright);max-width:42cqw;font-family:Georgia,serif;font-style:italic;font-size:2.16cqw}
.hero .frame{justify-content:center;align-items:flex-start}.hero h1,.hero h2{text-wrap:wrap;max-width:64cqw}
.hero h2{font-size:6.35cqw}.hero .brand{position:absolute;top:5cqw}.hero .lead{margin-top:2.2cqw}
.rule{width:4cqw;height:2px;background:var(--tone);margin-top:2.5cqw}
.foot{position:absolute;bottom:2.45cqw;left:5.25cqw;right:5.25cqw;padding-top:1cqw;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:1cqw;color:var(--sub);font:500 .92cqw var(--mono);letter-spacing:.05em}
.foot a{text-decoration:none}.foot a:hover{text-decoration:underline}
.in .reveal{animation:rise .68s cubic-bezier(.2,.7,.2,1) both;animation-delay:var(--d,.10s)}
@keyframes rise{from{opacity:0;transform:translateY(1.35cqw)}to{opacity:1;transform:none}}
.grid2{display:grid;grid-template-columns:1.04fr 1fr;gap:4cqw;margin-top:3.2cqw;min-height:0}.grid2.center{align-items:center}
.mark{font:700 1.1cqw var(--mono);text-transform:uppercase;letter-spacing:.09em;color:var(--tone)}
.small{font-size:1.38cqw;color:var(--sub);line-height:1.43}
.big{font-size:8.8cqw;font-weight:800;line-height:.95;letter-spacing:-.085em;color:var(--tone);font-variant-numeric:tabular-nums}
.stat{border-top:1px solid var(--line);padding-top:1.4cqw}
.stat p{margin-top:1cqw}.stat .big{margin-top:.8cqw}
svg.plot{display:block;width:100%;height:auto;overflow:visible}
.plot text{font-family:var(--mono);fill:currentColor}
.plot .gridline{fill:none;stroke:currentColor;stroke-opacity:.24;stroke-width:1}
.plot .trace{stroke:var(--tone);fill:none;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}
.plot .node{fill:var(--tone)}
[data-at]:not(.visible){visibility:hidden;opacity:0;pointer-events:none}
.in [data-at].arriving{animation:rise .68s cubic-bezier(.2,.7,.2,1) both}
.in .visible.arriving .draw{stroke-dasharray:1;animation:draw 1.25s .28s cubic-bezier(.24,.65,.22,1) both}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
.loop{margin-top:3.15cqw;display:grid;grid-template-columns:1fr 1.55fr;gap:4.7cqw;align-items:center}
.loop svg{max-height:25cqw}.loop .point{fill:var(--tone);opacity:.25;transition:opacity .25s,r .35s}.loop .point.on{opacity:1;r:11}
.steps{display:grid;gap:.65cqw}.step{background:transparent;color:inherit;text-align:left;border:0;border-top:1px solid var(--line);padding:1.15cqw 1cqw;display:grid;grid-template-columns:3cqw 1fr;column-gap:.7cqw;min-height:4.5cqw;transition:background .18s}
.step:hover,.step.on{background:#a1afff16}.step.on{box-shadow:inset 3px 0 var(--tone)}.step strong{font-size:1.8cqw}.step small{grid-column:2;color:var(--sub);font-size:1.25cqw;line-height:1.3}
.sim{display:grid;grid-template-columns:.78fr 1.22fr;gap:3.1cqw;margin-top:2cqw}
.sliders{display:grid;gap:1.1cqw;align-content:start}.sliders label{display:flex;justify-content:space-between;gap:.3cqw;font-size:1.38cqw;font-weight:700}
.sliders output{color:var(--tone);font-variant-numeric:tabular-nums}.sliders input{width:100%;accent-color:#a3321c;margin:.75cqw 0 0;cursor:pointer}
.presets{display:flex;flex-wrap:wrap;gap:.5cqw}.pill{background:transparent;color:inherit;border:1px solid var(--line);padding:.55cqw .75cqw;border-radius:99px;font-size:1.1cqw;white-space:nowrap}.pill:hover,.pill[aria-pressed="true"]{background:#8f361818;border-color:var(--tone)}
.metric{display:flex;align-items:flex-end;gap:1cqw;margin-bottom:.6cqw}.metric .big{font-size:6.8cqw}.metric .small{padding-bottom:.2cqw}
.hudrow{display:flex;gap:1.3cqw;align-items:center;margin-top:1cqw;flex-wrap:wrap}.primary{color:#1a1210;background:#ffad78;border:1px solid #ffad78;border-radius:3px;padding:.65cqw 1cqw;font-weight:700;font-size:1.25cqw}.paper .primary{background:#932e18;color:white;border-color:#932e18}.primary:hover{filter:brightness(1.12)}
.compare{display:grid;gap:1.2cqw;margin-top:2.6cqw}.track{position:relative;height:4.1cqw;border-top:1px solid var(--line);display:flex;align-items:flex-start;justify-content:space-between;gap:1cqw;padding-top:.55cqw}.track.keep{justify-content:flex-start}.track i{height:.45cqw;display:block;background:var(--tone);flex-shrink:0;transform-origin:left}.track.keep i{height:.8cqw}
.in .track:not([data-at]) i,.in .track.arriving i{animation:stretch .65s cubic-bezier(.19,1,.22,1) both;animation-delay:var(--d)}
@keyframes stretch{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.lattice{display:grid;grid-template-columns:repeat(3,1fr);gap:2.8cqw;margin-top:5cqw}.lattice article{border-top:1px solid var(--line);padding-top:1.6cqw}.lattice h3{margin:1cqw 0}.lattice .small{max-width:25cqw}
.cases{margin-top:3cqw;display:grid;gap:1.1cqw}.case{display:grid;grid-template-columns:19cqw 1fr;gap:2cqw;border-top:1px solid var(--line);padding-top:1.1cqw}.case h3{color:var(--tone);font-size:2cqw}.case p{font-size:1.55cqw;color:var(--sub);max-width:58cqw}
.sources{display:grid;grid-template-columns:1fr 1fr;gap:0 4cqw;margin-top:3.2cqw}.sources a{padding:1.35cqw 0;border-top:1px solid var(--line);text-decoration:none;font-size:1.65cqw;line-height:1.2}.sources a:hover{color:var(--tone)}.sources .mark{display:block;margin-bottom:.55cqw}
#blackout{position:absolute;inset:0;z-index:20;background:#000;display:grid;place-items:center;color:#aaa;cursor:pointer}#blackout[hidden]{display:none}
#controls{height:54px;width:min(100%,1220px);display:flex;gap:10px;align-items:center;padding:0 14px;color:#dadbe5}
#controls button{background:#161928;color:inherit;border:1px solid #33384b;border-radius:4px;min-height:32px;padding:0 9px;white-space:nowrap;font-size:13px}
#controls button:hover,#controls button[aria-pressed="true"]{border-color:var(--ember);color:var(--ember)}
#chapter{max-width:28vw;text-overflow:ellipsis;overflow:hidden}
#progress{flex:1;display:flex;gap:4px;align-items:center;min-width:16px}#progress i{height:2px;background:#383c50;flex:1}#progress i.done{background:#ffb37d}#progress i.now{height:4px;background:#ffe2c7}
#beat-track{display:flex;align-items:center;gap:4px}
#beat-track[hidden]{display:none}
#beat-track i{width:5px;height:5px;border-radius:50%;background:#3c4052}
#beat-track i.done{background:#c78354}
#beat-track i.now{background:#ffcfac}
#presenter-cue{color:var(--ember);margin-bottom:.7rem;font-weight:bold}
#counter{font:12px var(--mono);white-space:nowrap;color:var(--dim)}
#theater:fullscreen{grid-template-rows:1fr}#theater:fullscreen #stage{width:min(100vw,calc(100dvh*16/9))}
#theater:fullscreen #controls{position:absolute;bottom:0;z-index:5;background:#080a11df;opacity:0;transition:opacity .18s}#theater:fullscreen #controls:hover,#theater:fullscreen #controls:focus-within,#theater:fullscreen.moved #controls{opacity:1}
dialog{color-scheme:dark;background:#121626;color:var(--bright);border:1px solid #3e435b;border-radius:6px;padding:22px 26px;width:min(560px,94vw);max-height:80dvh}dialog::backdrop{background:#06090ccf}dialog header{display:flex;align-items:center;justify-content:space-between;gap:16px;position:sticky;top:0;background:inherit;padding-bottom:.8rem}dialog h2{font-size:1.45rem;line-height:1.1;letter-spacing:-.03em}dialog button{background:#202638;color:inherit;border:1px solid #424862;border-radius:4px;padding:.35rem .7rem}dialog button:hover{border-color:var(--ember)}dialog p{line-height:1.6;color:#d1d2e1}
#chapters{display:grid;gap:5px}#chapters button{text-align:left;line-height:1.3;padding:.55rem .7rem}.kbd{font-family:var(--mono);color:var(--ember)}
:root[lang="zh"] h1,:root[lang="zh"] h2{letter-spacing:-.02em;line-height:1.04}:root[lang="zh"] .brand,:root[lang="zh"] .mark{letter-spacing:.05em}
@media(prefers-reduced-motion:reduce){*,*::after,*::before{animation:none!important;transition:none!important}}
@media(max-width:650px) and (orientation:portrait){
 #stage,#theater:fullscreen #stage{width:100%;height:calc(100dvh - 50px);aspect-ratio:auto}
 .frame{padding:8cqw 5.5cqw 15cqw;overflow:auto}.brand{font-size:2.8cqw;margin-bottom:4cqw}.hero .brand{top:9cqw}.hero h1{font-size:14cqw;max-width:none}.hero h2{font-size:12cqw;max-width:none}h2{font-size:9.2cqw}h3{font-size:5.1cqw}.lead,.hero .lead{font-size:4cqw;margin-top:4cqw;max-width:92cqw}.foot{font-size:2cqw;bottom:4cqw;padding-top:2cqw;position:static;margin-top:auto}.hero .foot{position:absolute}
 .poster{background-position:60% center}.shade{background:linear-gradient(0deg,#070910ee,#07091052 85%)}.grid2,.loop,.sim{grid-template-columns:1fr;gap:4cqw;margin-top:5cqw}.small{font-size:3.1cqw}.mark{font-size:2.45cqw}.big{font-size:16cqw}.metric .big{font-size:11cqw}
 .loop svg{max-height:40cqw}.step{padding:2cqw;grid-template-columns:7cqw 1fr}.step strong,.case h3{font-size:4cqw}.step small,.case p,.sliders label,.sources a{font-size:3.3cqw}.sliders{gap:2.4cqw}.sliders input{margin-top:1cqw}.pill,.primary{font-size:3cqw;padding:1.5cqw 2.3cqw}.lattice{gap:3cqw;margin-top:6cqw}.lattice h3{font-size:4cqw}.lattice .small{max-width:none}.case{grid-template-columns:25cqw 1fr;padding-top:2cqw;margin-top:2cqw}.track{height:7cqw}.sources a{padding:3cqw 0}
 #controls{gap:4px;height:50px;padding:0 4px}#controls button{min-height:33px;padding:0 6px;font-size:12px}#counter,#progress,#beat-track{display:none}#chapter{flex:1;max-width:initial}
}
#race-open{background:#171a34;border-color:#171a34}
#race-dialog{
  width:min(94vw,calc(89dvh * 16 / 9),1340px);max-width:none;max-height:94dvh;aspect-ratio:16/9;margin:auto;
  padding:0;overflow:auto;border:1px solid #565773;border-radius:14px;container-type:inline-size;
  background:#090a17;color:#f4f2ff;box-shadow:0 28px 110px #000b;
}
#race-dialog::backdrop{background:#03030bf0}
#race-dialog[open] .race-stage{animation:race-in .58s cubic-bezier(.16,1,.3,1) both}
@keyframes race-in{from{opacity:0;transform:scale(.97);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
.race-stage{
 position:relative;isolation:isolate;min-height:100%;display:grid;align-content:start;
 padding:3.1cqw 4.4cqw 2.8cqw;overflow:hidden;
 background:radial-gradient(ellipse at 24% 43%,#202a654d,transparent 44%),radial-gradient(ellipse at 76% 43%,#592b284f,transparent 42%),#090a17;
}
.race-stage::before{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;background:repeating-linear-gradient(0deg,#b4c2ff0a 0 1px,transparent 1px 5px);mask-image:linear-gradient(#0000,#0009,#0000)}
.race-top{display:flex;gap:16px;align-items:flex-start;justify-content:space-between}
.race-title{margin:.7cqw 0 0;font-size:4.9cqw;line-height:.96;letter-spacing:-.051em;text-align:left;text-wrap:wrap}
.race-kicker,.race-name,.race-time,.race-caption{font:700 max(12px,1.1cqw) var(--mono);letter-spacing:.075em}
.race-kicker{color:#fdbc91}
.race-case{margin-top:1.15cqw;color:#c2c4de;font-size:max(12px,1.19cqw)}
.race-controls{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:5px}
.race-controls button{background:#16192e;color:#f0eeff;min-height:34px;font-size:max(12px,1.05cqw);white-space:nowrap}
.race-controls button:disabled{opacity:.4}
.race-dials{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:2.2cqw;margin:1.45cqw auto 0;width:min(96%,84cqw)}
.race-dial{display:grid;min-width:0;grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto;justify-items:center;--tint:#bacbff}
.race-dial.feedback{--tint:#ffad7b}
.race-dial canvas{grid-row:1;grid-column:1;width:100%;height:25.4cqw;display:block}
.race-value{grid-row:1;grid-column:1;align-self:center;margin-top:-.5cqw;font-size:9.4cqw;font-weight:800;line-height:1;letter-spacing:-.07em;font-variant-numeric:tabular-nums;color:var(--tint);text-shadow:0 0 3.1cqw color-mix(in srgb,var(--tint) 25%,transparent)}
.race-name{display:block;text-align:center;color:var(--tint);padding-top:.35cqw}
.race-timeline{margin-top:2.45cqw}
.race-timeline canvas{width:100%;height:max(30px,3.9cqw);display:block}
.race-timeline-meta{display:grid;grid-template-columns:1fr auto 1fr;gap:1cqw;align-items:center;margin-top:.35cqw;color:#aeb3d0}
.race-timeline-meta span:last-child{text-align:right}
.race-time{color:#fcf0e9;font-variant-numeric:tabular-nums;text-align:center}
.race-result{margin-top:1.55cqw;min-height:2.9em;text-align:center;color:#eee9ff;font-size:max(14px,1.5cqw);font-weight:700}
.race-stage[data-finished="true"] .race-result{animation:race-result .85s cubic-bezier(.16,1,.3,1) both}
@keyframes race-result{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media(max-width:650px) and (orientation:portrait){
 #race-dialog{width:100%;height:100dvh;max-height:none;border:0;border-radius:0;aspect-ratio:auto}
 .race-stage{padding:6cqw 5cqw;align-content:center}
 .race-top{display:block}
 .race-title{font-size:10.4cqw;margin-top:2.4cqw}
 .race-case{margin-top:3cqw}
 .race-controls{justify-content:flex-start;margin-top:4cqw}
 .race-dials{margin-top:6cqw;width:100%;gap:1cqw}
 .race-dial canvas{height:43cqw}
 .race-value{font-size:13cqw;margin-top:-1.2cqw}
 .race-name{padding-top:2cqw;letter-spacing:0}
 .race-timeline{margin-top:7cqw}
 .race-timeline canvas{height:11cqw}
 .race-timeline-meta{margin-top:2cqw}
 .race-caption{font-size:10px}
 .race-result{margin-top:5cqw}
}
</style>
</head>
<body>
<main id="theater">
<div id="stage" aria-label="Presentation" tabindex="0"></div>
<nav id="controls" aria-label="Presentation controls">
<button id="prev" aria-label="Previous scene">←</button>
<button id="chapter" aria-label="Scene menu">Scenes</button>
<button id="next" aria-label="Next scene">→</button>
<span id="progress" aria-hidden="true"></span><span id="beat-track" aria-hidden="true"></span><span id="counter" aria-hidden="true"></span>
<button id="audio" aria-pressed="false" title="Sound (M)">Sound</button>
<button id="notes" title="Speaker notes (N)">Notes</button>
<button id="lang" title="Switch language">中文</button>
<button id="full" title="Full screen (F)" aria-label="Full screen">⛶</button>
</nav>
<div id="blackout" hidden aria-label="Blackout. Click to return."></div>
<dialog id="menu"><header><h2 id="menu-title">Scenes</h2><form method="dialog"><button class="close">Close</button></form></header><div id="chapters"></div><p style="margin-top:1rem"><span class="kbd">← →</span> <span id="keys-one">Scenes</span> · <span class="kbd">.</span> <span id="keys-two">Blackout</span> · <span class="kbd">F</span> <span id="keys-three">Full screen</span></p></dialog>
<dialog id="race-dialog" aria-labelledby="race-title"></dialog><dialog id="presenter"><header><h2 id="presenter-title"></h2><form method="dialog"><button class="close">Close</button></form></header><p id="presenter-cue"></p><p id="presenter-text"></p></dialog>
</main>

 {names:['The signal','信号'],style:'paper',effect:'wipe',notes:['METR had unusual access to one lab. It estimated that the rate of improvement on a benchmark index rose 1.9× since October 2025. The 95% confidence interval is 1.5–2.8×. The team judged AI likely drove most of the ongoing acceleration, with substantial uncertainty about attribution. Keep separate the change in benchmark slope and its potential cause.','METR 深入调查了一家实验室。从 2025 年 10 月起，该实验室在一组基准测试上的进步速度估计是原来的 1.9 倍，95% 置信区间为 1.5–2.8 倍。团队判断 AI 可能贡献了大部分持续加速，但因果归因仍有很大不确定性。'],

 {names:['Close the loop','闭合回路'],style:'cobalt',effect:'lift',notes:['Select each step. Faster coding is a useful one-off gain. A recursive loop requires a successor that can help discover more useful improvements. In 2025, DeepMind reported AlphaEvolve cut Gemini’s training time about 1% by improving a kernel. That is a concrete narrow example of AI supporting the AI stack.','依次点亮三步。写代码提速本身就有价值。真正的递归还需要下一代 AI 能找到更多有效改进。2025 年，DeepMind 报告 AlphaEvolve 通过优化一个底层计算操作，让 Gemini 的整体训练时间减少约 1%。'],

 {names:['Run the experiment','现场实验'],style:'paper',effect:'wipe',notes:['Calibration is the lesson. Each round takes the longer of the selected minimum and the previous round multiplied by one minus the savings. We count completed rounds during 365 days, starting from a 30-day cycle. Ask the audience to choose one setting. Point out that the chart only models cadence. It assumes nothing about the size of capability gains.','让观众选一次设置。第一轮固定 30 天。此后每轮用时取上一轮缩短后的用时与下限中的较大值。模型统计 365 天内完成的轮数，只展示研发节奏，未估算能力每轮提升多少。'],

const BEATS={
 1:[['State the estimated change in rate.','先给出进步速度的估计值。'],['Reveal the measured interval.','揭示测得的置信区间。'],['Discuss the uncertainty about attribution.','讨论 AI 贡献比例的不确定性。']],
 2:[['Follow the model gain.','从模型能力提升讲起。'],['Show the effect on research.','解释如何加速研发。'],['Put the successor to work.','让下一代模型投入研发。']],
 5:[['Show one institutional decision.','先展示一项机构决策。'],['Reveal the research cycles in the same window.','揭示同一时间窗口内的研发轮次。']],
 8:[['Ask what the overseer can see.','问监督者能看见什么。'],['Ask what permissions can limit.','问权限能限制什么。'],['Ask who can actually stop the run.','问谁真正有权叫停。']]
};
const beatEnd=scene=>Math.max(0,(BEATS[scene]?.length??1)-1);
const reduce=matchMedia('(prefers-reduced-motion: reduce)');
let settings={saving:30,floor:3};

function formatStep(day){return T(`Day ${day} / 365`,`第 ${day} / 365 天`)}
function runModel(saving,floor){
 const endings=[];
 let length=30,total=0;
 while(total+length<=365){
   total+=length;
   endings.push(total);
   length=Math.max(floor,length*(1-saving/100));
 }
 return endings;
}
const baseline=runModel(0,1);
function runComparison(button, schedule, assumptions){
 const dialog=el('race-dialog');
 // Both lanes use the same 365-day calendar and the simulator's actual event times.
 const tracks=[
   {ends:baseline,color:'#a9c3ff',peak:'#e2ebff'},
   {ends:schedule,color:'#ff9c6a',peak:'#ffe1ae'}
 ];
 const duration=10800;
 dialog.innerHTML=`<section class="race-stage">
   <div class="race-top"><div><div class="race-kicker">${T('SIMULATION · COMPLETED RESEARCH CYCLES','情景模拟 · 已完成的研发轮次')}</div>
   <h2 id="race-title" class="race-title">${T('One year. Two clocks.','同一年，两只钟。')}</h2>
   <p class="race-case">${T(`Start: 30 days per cycle · Feedback: −${assumptions.saving}% time per round · Minimum: ${assumptions.floor} days`,`首轮 30 天 · 此后每轮缩短 ${assumptions.saving}% · 单轮最少 ${assumptions.floor} 天`)}</p></div>
   <div class="race-controls">
   <button data-race="pause">${T('Pause','暂停')}</button>
   <button data-race="skip">${T('Skip to result','看结果')}</button>
   <button data-race="close">${T('Close','关闭')}</button></div></div>
   <div class="race-dials">
   <div class="race-dial"><canvas aria-hidden="true"></canvas><strong class="race-value">0</strong><span class="race-name">${T('No feedback','无反馈')}</span></div>
   <div class="race-dial feedback"><canvas aria-hidden="true"></canvas><strong class="race-value">0</strong><span class="race-name">${T('Your settings','你的设定')}</span></div>
   </div>
   <div class="race-timeline"><canvas aria-hidden="true"></canvas><div class="race-timeline-meta">
   <span class="race-caption">${T('START','起点')}</span><strong class="race-time"></strong><span class="race-caption">${T('YEAR END','年末')}</span></div></div>
   <p class="race-result" aria-live="polite"></p>
 </section>`;
 const panel=dialog.querySelector('.race-stage');
 const canvases=panel.querySelectorAll('.race-dial canvas');
 const values=panel.querySelectorAll('.race-value');
 const timeline=panel.querySelector('.race-timeline canvas');
 const result=panel.querySelector('.race-result');
 const clock=panel.querySelector('.race-time');
 const main=panel.querySelector('[data-race="pause"]');
 const skip=panel.querySelector('[data-race="skip"]');
 const close=panel.querySelector('[data-race="close"]');
 let elapsed=0, prior=null, frame=0, running=false, finished=false, lastPulse=0;

 function canvasFrame(canvas){
   const w=canvas.clientWidth,h=canvas.clientHeight;
   const scale=Math.min(devicePixelRatio||1,2);
   if(canvas.width!==Math.round(w*scale)||canvas.height!==Math.round(h*scale)){
     canvas.width=Math.round(w*scale);canvas.height=Math.round(h*scale);
   }
   const ctx=canvas.getContext('2d');
   if(!ctx||!w||!h)return null;
   ctx.setTransform(scale,0,0,scale,0,0);
   ctx.clearRect(0,0,w,h);
   return {ctx,w,h};
 }
 const angle=day=>-Math.PI/2+(day/365)*Math.PI*2;
 function radial(ctx,x,y,r1,r2,a){
   ctx.moveTo(x+Math.cos(a)*r1,y+Math.sin(a)*r1);
   ctx.lineTo(x+Math.cos(a)*r2,y+Math.sin(a)*r2);
 }
 function dial(canvas,track,day,n){
   const surface=canvasFrame(canvas);
   if(!surface)return;
   const {ctx,w,h}=surface;
   const x=w/2,y=h/2,r=Math.min(w,h)*.402;
   const pulse=n>0?Math.pow(Math.max(0,1-(day-track.ends[n-1])/7),2):0;
   const bloom=ctx.createRadialGradient(x,y,r*.26,x,y,r*1.22);
   bloom.addColorStop(0,'transparent');bloom.addColorStop(.72,track.color+(n?'26':'12'));bloom.addColorStop(1,'transparent');
   ctx.fillStyle=bloom;ctx.fillRect(x-r*1.28,y-r*1.28,r*2.56,r*2.56);
   for(const scale of [.72,.83,1,1.07]){
     ctx.lineWidth=1;ctx.strokeStyle=track.color+'33';
     ctx.beginPath();ctx.arc(x,y,r*scale,0,Math.PI*2);ctx.stroke();
   }
   ctx.beginPath();
   for(let i=0;i<60;i++)radial(ctx,x,y,r*(i%5===0?1.08:1.12),r*1.15,angle(i*365/60));
   ctx.strokeStyle=track.color+'83';ctx.stroke();
   if(day>0){
     ctx.beginPath();ctx.arc(x,y,r,-Math.PI/2,angle(day));
     ctx.strokeStyle=track.color;ctx.lineWidth=Math.max(1.7,r*.021);ctx.stroke();
   }
   ctx.lineWidth=Math.max(1,r*.011);
   ctx.beginPath();
   for(let i=0;i<n;i++)radial(ctx,x,y,r*.85,r*.98,angle(track.ends[i]));
   ctx.strokeStyle=track.peak;ctx.stroke();
   const a=angle(day);
   const sx=x+Math.cos(a)*r,sy=y+Math.sin(a)*r;
   const head=ctx.createRadialGradient(sx,sy,0,sx,sy,Math.max(2,r*(.11+pulse*.18)));
   head.addColorStop(0,track.peak);head.addColorStop(.3,track.color+'ac');head.addColorStop(1,'transparent');
   ctx.fillStyle=head;ctx.beginPath();ctx.arc(sx,sy,r*.3,0,Math.PI*2);ctx.fill();
 }
 function strip(day,counts){
   const surface=canvasFrame(timeline);
   if(!surface)return;
   const {ctx,w,h}=surface;
   const x=d=>3+(w-6)*d/365;
   ctx.strokeStyle='#7d83a84c';ctx.lineWidth=1;ctx.beginPath();
   for(let i=0;i<=12;i++){ctx.moveTo(x(365*i/12),0);ctx.lineTo(x(365*i/12),h)}
   ctx.stroke();
   tracks.forEach((track,lane)=>{
     const y=h*(lane===0?.26:.72);
     ctx.strokeStyle=track.color+'5e';ctx.beginPath();ctx.moveTo(3,y);ctx.lineTo(w-3,y);ctx.stroke();
     ctx.strokeStyle=track.color;ctx.beginPath();
     for(let i=0;i<counts[lane];i++){const xx=x(track.ends[i]);ctx.moveTo(xx,y-h*.17);ctx.lineTo(xx,y+h*.17)}
     ctx.stroke();
   });
   ctx.strokeStyle='#fff8e5';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(x(day),0);ctx.lineTo(x(day),h);ctx.stroke();
 }
 function draw(day){
   const counts=tracks.map(track=>track.ends.filter(end=>end<=day).length);
   tracks.forEach((track,i)=>{
     if(values[i].textContent!==String(counts[i]))values[i].textContent=counts[i];
     dial(canvases[i],track,day,counts[i]);
   });
   strip(day,counts);
   clock.textContent=formatStep(Math.floor(day));
   return counts;
 }
 function finish(){
   cancelAnimationFrame(frame);running=false;finished=true;elapsed=duration;
   const [control,feedback]=draw(365);
   panel.dataset.finished='true';
   main.textContent=T('Replay','重播');skip.disabled=true;
   result.textContent=T(`Year complete. ${control} cycles without feedback · ${feedback} with your settings.`,`同一年结束。无反馈完成 ${control} 轮 · 按你的设定完成 ${feedback} 轮。`);
 }
 function tick(now){
   if(!running)return;
   if(prior!==null)elapsed+=Math.min(100,now-prior);
   prior=now;
   if(elapsed>=duration){
     finish();cue('lift');return;
   }
   const before=values[1].textContent;
   const [,feedback]=draw(365*elapsed/duration);
   if(String(feedback)!==before&&now-lastPulse>470){lastPulse=now;cue('cut')}
   frame=requestAnimationFrame(tick);
 }
 function begin(){
   if(reduce.matches){finish();main.disabled=true;return}
   running=true;finished=false;prior=null;main.textContent=T('Pause','暂停');
   skip.disabled=false;
   frame=requestAnimationFrame(tick);
 }
 main.onclick=()=>{
   if(finished){
     elapsed=0;lastPulse=0;result.textContent='';panel.dataset.finished='false';draw(0);begin();
   }else if(running){
     running=false;cancelAnimationFrame(frame);main.textContent=T('Resume','继续');
   }else begin();
 };
 skip.onclick=finish;
 close.onclick=()=>dialog.close();
 const resize=new ResizeObserver(()=>draw(365*elapsed/duration));
 dialog.addEventListener('close',()=>{
   running=false;cancelAnimationFrame(frame);resize.disconnect();button.focus();
 },{once:true});
 dialog.showModal();
 resize.observe(panel);
 close.focus();
 draw(0);begin();
}

function simulator(scene){
 const get=id=>scene.querySelector('#'+id);
 const saving=get('saving'), floor=get('floor'), curve=get('sim-curve'), example=get('base-curve'), marker=get('sim-marker');
 const clock=get('clock'), count=get('cycles'), play=get('play-year');
 let motion=0, results=[], max=16;
 const x=day=>55+507*day/365, y=n=>172-148*n/max;
 function display(days){
   function stair(ends){
     const visible=ends.filter(day=>day<=days);
     return {n:visible.length,path:'M55 172'+visible.map((end,i)=>`H${x(end).toFixed(2)}V${y(i+1).toFixed(2)}`).join('')+`H${x(days).toFixed(2)}`};
   }
   const state=stair(results);
   curve.setAttribute('d',state.path);
   example.setAttribute('d',stair(baseline).path);
   marker.setAttribute('cx',x(days));marker.setAttribute('cy',y(state.n));
   if(count.textContent!==String(state.n))count.textContent=state.n;
   clock.textContent=formatStep(Math.floor(days));
 }
 function update(){
   cancelAnimationFrame(motion);
   settings={saving:+saving.value,floor:+floor.value};
   get('saving-value').value=settings.saving+'%';
   get('floor-value').value=T(`${settings.floor} d`,`${settings.floor} 天`);
   results=runModel(settings.saving,settings.floor);
   const interval=Math.max(10,Math.ceil(results.length/20)*10);
   max=interval*2;
   get('scale-mid').textContent=interval;get('scale-max').textContent=max;
   for(const button of scene.querySelectorAll('[data-setting]')){
     button.setAttribute('aria-pressed',button.dataset.setting===`${settings.saving},${settings.floor}`);
   }
   play.disabled=false;
   display(365);
 }
 saving.value=settings.saving;floor.value=settings.floor;
 saving.addEventListener('input',update);floor.addEventListener('input',update);
 for(const button of scene.querySelectorAll('[data-setting]')){
   button.addEventListener('click',()=>{
     [saving.value,floor.value]=button.dataset.setting.split(',');
     update();
     cue('cut');
   });
 }
 play.addEventListener('click',()=>{
   cancelAnimationFrame(motion);
   if(reduce.matches){display(365);return}
   play.disabled=true;
   const start=performance.now(), runtime=2850;
   cue('lift');display(0);
   function tick(now){
     const p=Math.min(1,(now-start)/runtime);
     display(p*365);
     if(p<1)motion=requestAnimationFrame(tick);
     else{play.disabled=false;cue('cut')}
   }
   motion=requestAnimationFrame(tick);
 });
 const compare=get('race-open');
 compare.addEventListener('click',()=>runComparison(compare,results,settings));
 update();
 return ()=>cancelAnimationFrame(motion);
}
function setStep(scene,step){
 selectedStep=step;
 for(const layer of scene.querySelectorAll('[data-at]')){
   const visible=+layer.dataset.at<=step;
   layer.classList.toggle('arriving',visible&&!layer.classList.contains('visible'));
   layer.classList.toggle('visible',visible);
   layer.inert=!visible;
   layer.setAttribute('aria-hidden',!visible);
 }
 const cueTrack=document.getElementById('beat-track');
 const total=beatEnd(index)+1;
 cueTrack.replaceChildren(...Array.from({length:total},(_,i)=>{
   const dot=document.createElement('i');
   dot.className=i===step?'now':i<step?'done':'';
   return dot;
 }));
 cueTrack.hidden=total===1;
 for(const b of scene.querySelectorAll('[data-step]')){
   const active=+b.dataset.step===step;
   b.classList.toggle('on',active);b.setAttribute('aria-pressed',active);
 }
 for(const circle of scene.querySelectorAll('[data-point]')){
   circle.classList.toggle('on',+circle.dataset.point===step);
 }
}
function particles(canvas,kind){
 const ctx=canvas.getContext('2d');
 if(!ctx)return ()=>{};
 const final=kind==='drift';
 let id=0;
 function draw(now){
   const w=canvas.clientWidth,h=canvas.clientHeight;
   if(!w||!h)return;
   const pixel=Math.min(devicePixelRatio,1.75);
   if(canvas.width!==Math.round(w*pixel)||canvas.height!==Math.round(h*pixel)){
     canvas.width=Math.round(w*pixel);canvas.height=Math.round(h*pixel);
   }
   ctx.setTransform(pixel,0,0,pixel,0,0);
   ctx.clearRect(0,0,w,h);
   const x=w*(final?.75:.78), y=h*(final?.63:.52), base=Math.min(w,h), t=now/1000;
   ctx.strokeStyle=final?'#b1caff':'#ffbb84';ctx.lineWidth=.8;
   for(let j=0;j<11;j++){
     const r=base*(.077+j*.03);
     const a=j*.55+t*(.095+j*.015);
     ctx.globalAlpha=(final?.085:.19)*(1-j/14);
     ctx.beginPath();
     ctx.ellipse(x,y,r,r*(final?.95:.69),-.31,a,a+1.2+j*.2);
     ctx.stroke();
   }
   for(let j=0;j<53;j++){
     const r=base*(.06+(j%17)*.024), a=j*2.39996+t*(.11+(j%5)*.05);
     ctx.globalAlpha=(.5+.48*Math.sin(a*2+j))*(final?.22:.62);
     ctx.fillStyle=j%4?'#ffc297':'#bdd3ff';
     const dx=Math.cos(a)*r, dy=Math.sin(a)*r*.75;
     ctx.beginPath();
     ctx.arc(x+dx*.957+dy*.29,y+dy*.957-dx*.29,Math.max(.55,base*.0014)*(j%7===0?1.5:1),0,2*Math.PI);
     ctx.fill();
   }
   ctx.globalAlpha=1;
   if(!reduce.matches)id=requestAnimationFrame(draw);
 }
 draw(0);
 return ()=>cancelAnimationFrame(id);
}
function cue(effect){
 if(!sound)return;
 const Audio=window.AudioContext||window.webkitAudioContext;
 if(!Audio)return;
 try{
   audioContext??=new Audio();
   if(audioContext.state==='suspended')audioContext.resume().catch(()=>{});
   const t=audioContext.currentTime;
   const chord={iris:[55,82.41,110,164.81],wipe:[82.41,110,123.47],lift:[65.41,98,130.81],cut:[110,164.81]}[effect] || [82.41,123.47];
   const duration=effect==='iris'?.96:.42;
   chord.forEach((frequency,i)=>{
     const start=t+i*.043, stop=start+duration;
     const node=audioContext.createOscillator(), volume=audioContext.createGain();
     node.type=i===0?'sine':'triangle';
     node.frequency.setValueAtTime(frequency*.985,start);
     node.frequency.exponentialRampToValueAtTime(frequency,start+.18);
     volume.gain.setValueAtTime(.0001,start);
     volume.gain.exponentialRampToValueAtTime((i===0?.095:.037)/(1+i*.2),start+.12);
     volume.gain.exponentialRampToValueAtTime(.0001,stop);
     node.connect(volume).connect(audioContext.destination);node.start(start);node.stop(stop);
   });
 }catch{}
}
function syncControls(){
 document.documentElement.lang=language;
 el('prev').disabled=index===0;
 el('next').disabled=index===SCENES.length-1;
 el('chapter').textContent=SCENES[index].names[language==='zh'?1:0];
 el('chapter').setAttribute('aria-label',T('Scene menu','场景目录'));
 el('counter').textContent=`${String(index+1).padStart(2,'0')} / ${SCENES.length}`;
 el('counter').setAttribute('aria-label',T(`Scene ${index+1} of ${SCENES.length}`,`第 ${index+1} 幕，共 ${SCENES.length} 幕`));
 el('audio').textContent=T(sound?'Sound on':'Sound','声音'+(sound?'开':''));
 el('audio').setAttribute('aria-pressed',sound);
 el('lang').textContent=T('中文','EN');
 el('notes').textContent=T('Notes','备注');
 el('prev').setAttribute('aria-label',T('Previous scene','上一幕'));
 el('next').setAttribute('aria-label',T('Next scene','下一幕'));
 el('full').setAttribute('aria-label',T('Full screen','全屏'));
 for(const button of document.querySelectorAll('.close'))button.textContent=T('Close','关闭');
 el('menu-title').textContent=T('Scenes','场景目录');
 el('keys-one').textContent=T('Advance / back','前进 / 后退');
 el('keys-two').textContent=T('Blackout','黑屏');
 el('keys-three').textContent=T('Full screen','全屏');
 el('progress').replaceChildren(...SCENES.map((_,i)=>{
   const line=document.createElement('i');line.className=i===index?'now':i<index?'done':'';return line;
 }));
}
function show(to,{replace=false,step=0,quiet=false}={}){
 if(to<0||to>=SCENES.length||(!replace&&to===index&&stage.firstElementChild))return;
 cleanup();
 clearTimeout(exitTimer);
 for(const outgoing of stage.querySelectorAll('.out'))outgoing.remove();
 const previous=stage.querySelector('.in');
 if(previous){
   if(replace)previous.remove();
   else{previous.className=previous.className.replace(/\bin\b/,'out');previous.inert=true;previous.setAttribute('aria-hidden','true')}
 }
 index=to;selectedStep=step;
 const view=SCENES[index];
 const scene=document.createElement('section');
 scene.className='scene in '+view.style;
 scene.dataset.effect=reduce.matches||replace?'cut':view.effect;
 scene.dataset.index=String(index);
 scene.setAttribute('aria-label',T(...view.names));
 const names=T(...view.names);
 const artwork=view.art?`<div class="poster" style="background-image:url(${ASSETS[view.art]})"></div><div class="shade"></div>`:'';
 const rings=view.art==='ignition'||view.art==='drift'?'<canvas class="rings" aria-hidden="true"></canvas>':'';
 scene.innerHTML=artwork+rings+`<div class="frame"><p class="brand">${index===0?T('An interactive keynote','一场交互式主题演讲'):names}</p>${view.draw()}</div>`;
 stage.append(scene);
 if(previous)exitTimer=setTimeout(()=>previous.remove(),1110);
 setStep(scene,step);
 if(index===2){
   for(const b of scene.querySelectorAll('[data-step]'))b.addEventListener('click',()=>{setStep(scene,+b.dataset.step);cue('cut')});
 }
 cleanup=index===3?simulator(scene):rings?particles(scene.querySelector('canvas'),view.art):()=>{};
 syncControls();
 if(!quiet)cue(view.effect);
 try{history.replaceState(null,'','#'+(index+1))}catch{}
}
function move(dir,beats=true){
 if(el('blackout').hidden===false){el('blackout').hidden=true;return}
 if(beats&&selectedStep+dir>=0&&selectedStep+dir<=beatEnd(index)){
   setStep(stage.querySelector('.in'),selectedStep+dir);cue('cut');return;
 }
 show(index+dir,{step:dir<0?beatEnd(index-1):0});
}
function menu(){
 const items=SCENES.map((s,i)=>{
   const b=document.createElement('button');
   b.textContent=`${String(i+1).padStart(2,'0')}  ·  ${T(...s.names)}`;
   if(i===index)b.setAttribute('aria-current','true');
   b.onclick=()=>{el('menu').close();show(i)};
   return b;
 });
 el('chapters').replaceChildren(...items);
 el('menu').showModal();
}
function notes(){
 const s=SCENES[index];
 el('presenter-title').textContent=T(...s.names);
 const beat=BEATS[index]?.[selectedStep];
 el('presenter-cue').hidden=!beat;
 el('presenter-cue').textContent=beat?T(...beat):'';
 el('presenter-text').textContent=T(...s.notes);
 el('presenter').showModal();
}
async function fullscreen(){
 try{
   if(document.fullscreenElement)await document.exitFullscreen();
   else if(theater.requestFullscreen)await theater.requestFullscreen();
 }catch{stage.focus()}
}
function toggleAudio(){sound=!sound;syncControls();if(sound)cue('iris')}
function blackout(){el('blackout').hidden=!el('blackout').hidden}
el('prev').onclick=()=>move(-1);el('next').onclick=()=>move(1);
el('chapter').onclick=menu;el('notes').onclick=notes;el('full').onclick=fullscreen;
el('audio').onclick=toggleAudio;el('blackout').onclick=blackout;
el('lang').onclick=()=>{language=T('zh','en');show(index,{replace:true,step:selectedStep,quiet:true})};
theater.addEventListener('pointermove',()=>{
 if(!document.fullscreenElement)return;
 theater.classList.add('moved');
 clearTimeout(uiTimer);
 uiTimer=setTimeout(()=>theater.classList.remove('moved'),1500);
});
stage.addEventListener('click',event=>{
 if(!event.target.closest('button,a,input,label,output')&&!window.getSelection()?.toString())move(1);
});
document.addEventListener('keydown',event=>{
 if(event.altKey||event.ctrlKey||event.metaKey||document.querySelector('dialog[open]')||event.target.closest('input'))return;
 const k=event.key.toLowerCase();
 if(k===' '&&event.target.closest('button,a'))return;
 const actions={
  arrowright:()=>move(1),arrowdown:()=>move(1),pagedown:()=>move(1),' ':()=>move(1),
  arrowleft:()=>move(-1),arrowup:()=>move(-1),pageup:()=>move(-1),
  home:()=>show(0),end:()=>show(SCENES.length-1),f:fullscreen,n:notes,m:toggleAudio,o:menu,'.':blackout
 };
 if(actions[k]){event.preventDefault();actions[k]()}
});
const pageNumber=Number(location.hash.slice(1));
show(Number.isInteger(pageNumber)&&pageNumber>=1&&pageNumber<=SCENES.length?pageNumber-1:0,{quiet:true});
</script>
